name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    uses: benvon/reusable-workflows/.github/workflows/go-quality.yml@7a10cbed2f19546444ca465c04976727abf108f7
    with:
      quality_command: make ci-local
      coverage_file: coverage.out
      upload_codecov: true
      codecov_flags: unittests
      codecov_name: codecov-umbrella
